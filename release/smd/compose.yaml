x-api-image: &api-image
  image: ${SMD_API_IMAGE:?}
services:
  postgres:
    image: ${SMD_POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_USER: command
      POSTGRES_DB: command
      POSTGRES_PASSWORD: ${SMD_DATABASE_PASSWORD:?}
    volumes:
      - command-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "command"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${SMD_REDIS_IMAGE:?}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://command:${SMD_DATABASE_PASSWORD:?}@postgres/command
      REDIS_URL: redis://redis:6379/0
      PGOPTIONS: "-c smartdev.install_kind=tenant"
      PORTAL_ORIGIN: ${SMD_PORTAL_ORIGIN:?}
      CODER_API_URL: http://coder:7080
      CODER_PUBLIC_URL: ${SMD_CODER_ORIGIN:?}
      MEMORY_ACCESS_KEY: ${SMD_MEMORY_KEY:?}
      SESSION_KEY: ${SMD_SESSION_KEY:?}
      OWNER_PASSWORD_HASH: ${SMD_OWNER_PASSWORD_HASH:?}
      OPENBAO_ADDR: http://openbao:8200
    volumes:
      - ${SMD_DATA_DIR:?}/vault-client:/run/command-vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [default, vault]
  portal:
    image: ${SMD_PORTAL_IMAGE:?}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
  openbao:
    image: ${SMD_OPENBAO_IMAGE:?}
    command: ["server", "-config=/openbao/config/smartdev.hcl"]
    restart: unless-stopped
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks: [vault]
    volumes:
      - ./openbao.hcl:/openbao/config/smartdev.hcl:ro
      - vault-data:/openbao/file
  vault-bootstrap:
    <<: *api-image
    user: "0:0"
    command: ["python", "/vault-bootstrap.py"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:mode=0700]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    depends_on:
      openbao:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/vault-bootstrap.py", "--health"]
      interval: 5s
      timeout: 4s
      retries: 24
    networks: [vault]
    volumes:
      - ./vault-bootstrap.py:/vault-bootstrap.py:ro
      - ./vault-policy.hcl:/vault-policy.hcl:ro
      - ${SMD_DATA_DIR:?}/vault-operator:/vault-operator
      - ${SMD_DATA_DIR:?}/vault-client:/vault-client
  coder:
    image: ${SMD_CODER_IMAGE:?}
    restart: unless-stopped
    environment:
      CODER_ACCESS_URL: ${SMD_CODER_ORIGIN:?}
      CODER_DERP_FORCE_WEBSOCKETS: "true"
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_PG_CONNECTION_URL: postgresql://coder:${SMD_CODER_DB_PASSWORD:?}@coder-db/coder?sslmode=disable
      CODER_TELEMETRY_ENABLE: "false"
    depends_on:
      coder-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7080/healthz"]
      interval: 5s
      timeout: 4s
      retries: 24
  coder-db:
    image: ${SMD_CODER_DB_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_DB: coder
      POSTGRES_PASSWORD: ${SMD_CODER_DB_PASSWORD:?}
    volumes:
      - coder-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coder"]
      interval: 5s
      timeout: 3s
      retries: 20
  edge:
    image: ${SMD_EDGE_IMAGE:?}
    restart: unless-stopped
    ports:
      - "${SMD_BIND_ADDRESS:-0.0.0.0}:${SMD_PORTAL_PORT:-443}:443"
      - "${SMD_BIND_ADDRESS:-0.0.0.0}:${SMD_HTTP_PORT:-80}:80"
    environment:
      SMD_PUBLIC_HOST: ${SMD_PUBLIC_HOST:?}
    volumes:
      - ${SMD_DATA_DIR:?}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SMD_DATA_DIR:?}/edge-tls:/run/smd-edge-tls:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
      coder:
        condition: service_healthy
networks:
  vault:
    internal: true
volumes:
  command-data:
  coder-data:
  redis-data:
  vault-data:
  edge-data:
  edge-config:
