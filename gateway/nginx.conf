worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    log_format minimal '$time_iso8601 $request_method $status $upstream_status $request_time';
    access_log /dev/stdout minimal;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        location = /__smartdev/gateway-health {
            return 204;
        }
        location = /__smartdev/authorize {
            internal;
            set $registry http://api:8000;
            proxy_pass $registry/internal/dev-gateway/authorize;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header X-SmartDev-Preview-URI $request_uri;
            include /etc/nginx/dev-gateway-auth.inc;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location ~ ^/@[^/]+/[^/]+/apps/dev-preview(/|$) {
            auth_request /__smartdev/authorize;
            set $workspace_transport http://coder:7080;
            proxy_pass $workspace_transport$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        location / { return 404; }
    }
}
